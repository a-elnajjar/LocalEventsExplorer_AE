#
#  .swiftlint.yml
#  LocalEventsExplorer_AE
#
#  Created by Abdalla Elnajjar on 2026-11-19.
#


included:
  - LocalEventsExplorer_AE
  - LocalEventsExplorer_AETests

excluded:
  - LocalEventsExplorer_AEUITests
  - DerivedData

disabled_rules:
  - todo

opt_in_rules:
  - empty_count
  - first_where
  - sorted_imports
  - force_unwrapping
  - closure_spacing
  - redundant_nil_coalescing

line_length:
  warning: 120
  error: 160

identifier_name:
  excluded: [id, url, lat, lng]

type_body_length:
  warning: 250

# Xcode's generated names keep the project's "_AE" suffix.
type_name:
  excluded: [LocalEventsExplorer_AEApp, LocalEventsExplorer_AETests]
